<div class="slider-container">
  <label for="file-slider">Max Files: {{ block?.quest_meta.maxFileNumber }}</label>
  <div class="range-slider">
    <input
      type="range"
      id="file-slider"
      min="1"
      [max]="maxRangeNumber"
      [value]="block?.quest_meta.maxFileNumber"
      (input)="onSliderChange($event)"
      #slider
    />
    <!-- <output [style.left.%]="(slider.valueAsNumber) * (100 / maxRangeNumber)">{{ maxFile }}</output> -->
  </div>
</div>
